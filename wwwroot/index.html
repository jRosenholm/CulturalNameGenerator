<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultural Name Generator</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Cultural Name Generator</h1>
        <form id="nameForm">
            <label for="cultures">Culture(s):</label>
            <input type="text" id="cultureList" name="cultures" placeholder="e.g., incan, aztec" list="cultureList" required>

            <label for="numberOfNames">Number of Names:</label>
            <input type="number" id="numberOfNames" name="numberOfNames" min="1" value="1" required>

            <button type="submit">Get Names</button>
        </form>

        <div id="results">
            <h2>Generated Names</h2>
            <div id="cultureGrid" class="grid-container"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
